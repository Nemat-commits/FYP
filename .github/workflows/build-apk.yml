name: Build Terrastep APK

on:
  push:
    branches:
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Mapbox build configuration
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          if [ -z "$MAPBOX_ACCESS_TOKEN" ]; then
            echo "::error::Set the repository Actions secret MAPBOX_ACCESS_TOKEN before rebuilding."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze Dart code
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze-output.log 2>&1
          result=$?
          cat analyze-output.log
          if [ "$result" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done < analyze-output.log
          fi
          exit "$result"

      - name: Flutter widget tests
        run: flutter test

      - name: Build ARM64 APK
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        shell: bash
        run: |
          set +e
          flutter build apk --release --target-platform android-arm64 --dart-define=MAPBOX_ACCESS_TOKEN="$MAPBOX_ACCESS_TOKEN" > build-output.log 2>&1
          result=$?
          cat build-output.log
          if [ "$result" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          lines = Path('build-output.log').read_text(errors='replace').splitlines()
          for line in lines[-100:]:
              if line.strip():
                  escaped = line.replace('%', '%25').replace('\r', '%0D')
                  print(f'::error::{escaped}')
          PY
          fi
          exit "$result"

      - name: GPS recording policy tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: terrastep-30percent-milestone-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish installable APK to branch
        run: |
          mkdir -p releases
          cp build/app/outputs/flutter-apk/app-release.apk releases/terrastep-milestone30-arm64.apk
          sha256sum releases/terrastep-milestone30-arm64.apk > releases/SHA256SUMS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/terrastep-milestone30-arm64.apk releases/SHA256SUMS
          git diff --cached --quiet && exit 0
          git commit -m "Publish installable Terrastep ARM64 APK [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
